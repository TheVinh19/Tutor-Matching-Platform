name: giasu
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Required}
      TUTOR_DB_PASSWORD: ${TUTOR_DB_PASSWORD:?Required}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD:?Required}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Required}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Required}
      # P16-P18 services: defaults keep an older .env working.
      ASSESSMENT_DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-local_assessment_change_me}
      CARE_DB_PASSWORD: ${CARE_DB_PASSWORD:-local_care_change_me}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-local_ai_change_me}

    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./postgres/init-p16-p18.sql:/docker-entrypoint-initdb.d/02-p16-p18.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  kafka:
    image: apache/kafka:4.1.0
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: ["kafka_data:/tmp/kraft-combined-logs"]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  identity-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/identity-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      DB_URL: jdbc:postgresql://postgres:5432/account_db
      DB_USERNAME: account_app
      DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy

  tutor-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/tutor-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      BOOKING_SERVICE_URL: http://booking-service:8083
      DB_URL: jdbc:postgresql://postgres:5432/tutor_db
      DB_USERNAME: tutor_app
      DB_PASSWORD: ${TUTOR_DB_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy

  booking-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/booking-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      TUTOR_SERVICE_URL: http://tutor-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      DB_URL: jdbc:postgresql://postgres:5432/learning_db
      DB_USERNAME: learning_app
      DB_PASSWORD: ${LEARNING_DB_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/payment-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/notification-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Required}
    depends_on:
      postgres:
        condition: service_healthy

  assessment-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/assessment-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      BOOKING_SERVICE_URL: http://booking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      DB_URL: jdbc:postgresql://postgres:5432/assessment_db
      DB_USERNAME: assessment_app
      DB_PASSWORD: ${ASSESSMENT_DB_PASSWORD:-local_assessment_change_me}
    depends_on:
      postgres:
        condition: service_healthy

  care-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/care-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      BOOKING_SERVICE_URL: http://booking-service:8083
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
      IDENTITY_SERVICE_URL: http://identity-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      DB_URL: jdbc:postgresql://postgres:5432/care_db
      DB_USERNAME: care_app
      DB_PASSWORD: ${CARE_DB_PASSWORD:-local_care_change_me}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: services/ai-service
    environment:
      JWT_SECRET: ${JWT_SECRET:?Required}
      CARE_SERVICE_URL: http://care-service:8087
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
      BOOKING_SERVICE_URL: http://booking-service:8083
      DB_URL: jdbc:postgresql://postgres:5432/ai_db
      DB_USERNAME: ai_app
      DB_PASSWORD: ${AI_DB_PASSWORD:-local_ai_change_me}
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    profiles: [app]
    build:
      context: ../server
      args:
        MODULE: api-gateway
    ports: ["127.0.0.1:8090:8080"]
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8081
      TUTOR_SERVICE_URL: http://tutor-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
      ASSESSMENT_SERVICE_URL: http://assessment-service:8086
      CARE_SERVICE_URL: http://care-service:8087
      AI_SERVICE_URL: http://ai-service:8089

    depends_on: [identity-service, tutor-service, booking-service, payment-service, notification-service, assessment-service, care-service, ai-service]
  web:
    profiles: [app]
    build: ../web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      API_GATEWAY_URL: http://api-gateway:8080
      # Lets the login page offer one-click demo logins (mock login, mục 3). Empty = buttons only fill the email.
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on: [api-gateway]
  nginx:
    profiles: [app]
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:8088:80"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api-gateway]
volumes:
  postgres_data:
  kafka_data:
