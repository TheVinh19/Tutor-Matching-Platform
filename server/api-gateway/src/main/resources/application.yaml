server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: account-health
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/identity/health
              filters:
                - SetPath=/actuator/health
            - id: tutor-health
              uri: ${TUTOR_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tutors/health
              filters:
                - SetPath=/actuator/health
            - id: learning-health
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/health
              filters:
                - SetPath=/actuator/health
            - id: payment-health
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/payments/health
              filters:
                - SetPath=/actuator/health
            - id: notification-health
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/health
              filters:
                - SetPath=/actuator/health
            - id: assessment-health
              uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/assessments/health
              filters:
                - SetPath=/actuator/health
            - id: care-health
              uri: ${CARE_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/care/health
              filters:
                - SetPath=/actuator/health
            - id: ai-health
              uri: ${AI_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/ai/health
              filters:
                - SetPath=/actuator/health
            # Business APIs: forwarded unchanged; each service validates the JWT itself.
            # Health routes above are listed first so they win over these wildcards.
            - id: identity-api
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/identity/**
            - id: tutor-api
              uri: ${TUTOR_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tutors/**
            - id: booking-api
              uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/bookings/**
            - id: notification-api
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**
            - id: assessment-api
              uri: ${ASSESSMENT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/assessments/**
            - id: care-api
              uri: ${CARE_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/care/**
            - id: ai-api
              uri: ${AI_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/v1/ai/**
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
